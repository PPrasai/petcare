name: deploy

# Every push to main whose ci run passes is built and deployed to https://petcare.pprasai.io.
# Run it by hand from the Actions tab to redeploy the current main.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # Pull requests that touch the images only build them (no push, no deploy).
  pull_request:
    branches: [main]
    paths: [deploy/**, .dockerignore, pnpm-lock.yaml, .github/workflows/deploy.yml]

permissions:
  contents: read
  packages: write

# One deploy at a time; a newer one waits for the running one instead of interrupting it.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/pprasai/petcare-api:${{ env.SHA }}
          labels: org.opencontainers.image.source=https://github.com/PPrasai/petcare
          cache-from: type=gha,scope=petcare
          cache-to: type=gha,scope=petcare,mode=max
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/pprasai/petcare-web:${{ env.SHA }}
          labels: org.opencontainers.image.source=https://github.com/PPrasai/petcare
          cache-from: type=gha,scope=petcare

  deploy:
    needs: images
    # Switched on by the repository variable DEPLOY_ENABLED=true once the VPS is set up.
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://petcare.pprasai.io
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@$HOST" "deploy $SHA"
      - name: Smoke test through the public URL
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://petcare.pprasai.io/api/health
          curl -fsS -o /dev/null https://petcare.pprasai.io/
