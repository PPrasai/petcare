# PetCare collector config: the image's default (grafana/otel-lgtm 0.39.0) plus the hostmetrics
# receiver for CPU, memory, disk and filesystem (AS section 6). Mounted over
# /otel-lgtm/otelcol-config.yaml by compose.dev.yaml. The collector is never published.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      load:
      disk:
      filesystem:
        # Containers and many VPS images mount "/" as overlay, which the scraper skips by default.
        include_virtual_filesystems: true
        exclude_fs_types:
          match_type: strict
          fs_types: [proc, sysfs, devpts, tmpfs, cgroup, cgroup2, mqueue, devtmpfs, nsfs, squashfs]
        metrics:
          system.filesystem.utilization:
            enabled: true
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: 'opentelemetry-collector'
          scrape_interval: 1s
          static_configs:
            - targets: ['127.0.0.1:8888']

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: '/ready'

processors:
  batch:

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp_grpc/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true
  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/traces]
      #exporters: [otlp_http/traces,debug/traces]
    metrics:
      receivers: [otlp, hostmetrics, prometheus/collector]
      processors: [batch]
      exporters: [otlp_http/metrics]
      #exporters: [otlp_http/metrics,debug/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/logs]
      #exporters: [otlp_http/logs,debug/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp_grpc/profiles]
